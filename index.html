<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quizoner</title>
<style>body{font-family:system-ui;margin:0;background:#0f172a;color:#e2e8f0}header{background:#1e293b;padding:1rem 2rem}main{padding:2rem;max-width:700px;margin:0 auto}.card{background:#1e293b;padding:1.5rem;border-radius:12px;margin-bottom:1rem}label{display:block;margin:.5rem 0 .2rem}input,textarea{width:100%;padding:.6rem;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff;box-sizing:border-box}button{padding:.7rem 1.2rem;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;margin-top:1rem}.msg{margin-top:1rem;color:#34d399}</style></head>
<body><header><h1>🎯 Quizoner — Masukan</h1></header><main>
<div class="card">
  <label>Nama</label><input id="nama" placeholder="Nama Anda">
  <label>Masukan</label><textarea id="masukan" rows="4" placeholder="Tulis masukan..."></textarea>
  <button onclick="submit()">Kirim</button>
  <div class="msg" id="msg"></div>
</div></main>
<script>
async function submit(){
  const nama=document.getElementById('nama').value;
  const masukan=document.getElementById('masukan').value;
  const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nama,masukan})});
  const d=await r.json();
  document.getElementById('msg').textContent=d.ok?'Terkirim! Terima kasih.':'Gagal.';
  if(d.ok){document.getElementById('nama').value='';document.getElementById('masukan').value='';}
}
</script></body></html>
