<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quizoner</title>
<style>body{font-family:system-ui;margin:0;background:#0f172a;color:#e2e8f0}header{background:#1e293b;padding:1rem 2rem}main{padding:2rem;max-width:900px;margin:0 auto}.card{background:#1e293b;padding:1.5rem;border-radius:12px;margin-bottom:1rem}button{padding:.6rem 1rem;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}pre{background:#020617;color:#e2e8f0;padding:1rem;border-radius:8px;overflow:auto}input{padding:.5rem;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff}</style></head>
<body><header><h1>🎯 Quizoner</h1></header><main>
<div class="card"><h2>Tambah Pertanyaan</h2><input id="q" placeholder="Pertanyaan..." style="width:70%"><button onclick="add()">Simpan</button></div>
<div class="card"><h2>Daftar</h2><button onclick="load()">Muat</button><pre id="out">-</pre></div></main>
<script>
async function load(){const r=await fetch('/api/questions');document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}
async function add(){const q=document.getElementById('q').value;await fetch('/api/questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});load()}
</script></body></html>
